<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>识骨 · 答题中</title>
<meta name="description" content="识骨练习答题页：在整副骨架上点出目标骨，或作答看图选名、特征归属与判断题；答完看解剖依据，错题自动收进错题本。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='9' width='7' height='19' rx='3.5' fill='%23b4432f'/%3E%3Ccircle cx='10.5' cy='7' r='4.5' fill='%23b4432f'/%3E%3Crect x='19' y='4' width='7' height='19' rx='3.5' fill='%2329241d'/%3E%3Ccircle cx='22.5' cy='26' r='3.5' fill='%2329241d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand-row">
      <span class="brand">练习</span>
      <a class="back" href="practice.html">← 练习首页</a>
    </div>
    <p class="sub" id="quizSub">加载中…</p>
    <div class="pseg" id="pSeg" aria-hidden="true"></div>
    <div class="progress">
      <span id="stepText">第 1 / 6 题</span>
      <span id="streakChip" class="chip streak" hidden>连对 2</span>
      <span id="scoreText">答对 0</span>
    </div>
  </header>

  <main>
    <section id="quizView" aria-live="polite">
      <div class="qbar">
        <span id="modeChip" class="chip" hidden>错题重练</span>
        <span id="reviewChip" class="chip warn" hidden>待审核</span>
        <h1 id="questionText">题目加载中…</h1>
        <div class="qtools">
          <button id="hintBtn" class="ghost" type="button" aria-expanded="false" aria-controls="hintCard">提示</button>
          <button id="lensBtn" class="ghost" type="button" aria-pressed="false" hidden>放大镜</button>
        </div>
      </div>
      <div id="hintCard" class="hint" hidden>
        <p id="hintText"></p>
      </div>

      <div id="imgArea">
        <figure class="stage skel" id="stage" tabindex="0" aria-label="人体骨架前面观，点击题目要求的骨">
          <img id="boneImg" alt="人体骨架前面观渲染图" draggable="false">
          <div id="revealBad" class="reveal bad"></div>
          <div id="revealOk" class="reveal ok"></div>
          <span id="tagBad" class="reveal-tag bad"></span>
          <span id="tagOk" class="reveal-tag ok"></span>
          <svg id="overlay" viewBox="0 0 800 2108" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
          <div id="lens" class="lens" aria-hidden="true"></div>
          <span class="badge">前面观 · BodyParts3D 渲染</span>
          <div id="toast" class="toast" hidden>请点在骨头上</div>
        </figure>
        <p class="imglabel" id="imgLabel"></p>
      </div>

      <figure id="mcqFig" class="mcq-fig" hidden>
        <img id="mcqImg" alt="题目所指的骨渲染图">
        <figcaption>单骨渲染图 · 前面观</figcaption>
      </figure>

      <div id="choiceArea" class="optlist" hidden></div>

      <section id="feedback" class="feedback" hidden>
        <div id="verdict" class="verdict"></div>
        <p id="explain" class="explain"></p>
        <div class="fb-actions">
          <a id="kbLink" class="back" href="kb.html" hidden>在知识库查看此骨 →</a>
          <button id="nextBtn" class="primary" type="button">下一题</button>
        </div>
        <p class="kbd-note" id="kbdNote"><kbd>1</kbd>–<kbd>4</kbd> 选择 · <kbd>H</kbd> 提示 · <kbd>Enter</kbd> 下一题</p>
      </section>
    </section>

    <section id="resultView" class="result" hidden>
      <h1>本轮完成</h1>
      <div id="bigScore" class="big-score">0 / 6</div>
      <p id="resultNote" class="result-note"></p>
      <div id="kindBreakdown" class="breakdown"></div>
      <section id="wrongCard" class="card wrong-card" hidden>
        <h2>本轮错题回顾</h2>
        <div id="wrongList"></div>
      </section>
      <div class="result-actions">
        <button id="retryBtn" class="primary" type="button">重练错题</button>
        <button id="againBtn" class="ghost" type="button">再来一轮</button>
        <a class="back center" href="practice.html">返回练习首页</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>骨图渲染自 BodyParts3D, © The Database Center for Life Science（CC BY-SA 2.1 JP，骨图同许可共享）</p>
    <p>作者：孟睿超（山东中医药大学）· 队友署名待补（西交利物浦大学）</p>
    <p>仅供解剖学学习使用，不构成诊疗建议</p>
  </footer>
</div>
<script src="app.js?v=4"></script>
</body>
</html>
